<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mother's Day | Your Style Book</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Caveat:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- html2canvas library for JPEG export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <!-- STATE 1: PINK AURORA LANDING PAGE -->
    <section id="landing-page" class="aurora-container">
        <div class="aurora-bg"></div>
        <div class="hero-content">
            <h1 class="hero-title">Celebrate that Mother figure in your life today</h1>
            <p class="hero-subtitle">Turn your memories into a beautiful digital scrapbook. Every flower, every word, just for Mom.</p>
            <button id="start-btn" class="main-cta">Start My Book</button>
        </div>
    </section>

    <!-- STATE 2: THE INPUT FORM -->
    <main id="setup-screen" class="container hidden">
        <section class="form-card">
            <h2>The Details</h2>
            <div class="field">
                <label>Her Name</label>
                <input type="text" id="mom-name-input" placeholder="e.g. Mama Linda">
            </div>
            <div class="field">
                <label>The Message</label>
                <textarea id="message-input" placeholder="Write from the heart..."></textarea>
            </div>
            <div class="field">
                <label class="upload-box">
                    <span id="file-status">📸 Add a Photo</span>
                    <input type="file" id="photo-upload" accept="image/*">
                </label>
            </div>
            <button id="generate-btn">Create Digital Card</button>
        </section>
    </main>

    <!-- STATE 3: THE STYLE BOOK CARD -->
    <div id="card-screen" class="hidden">
        <div class="flower-decor top-left">🌸</div>
        <div class="flower-decor bottom-right">🌺</div>

        <div class="style-book">
            <div class="polaroid-frame">
                <img id="final-photo" src="" alt="Memory">
                <div class="tape"></div>
            </div>
            
            <div class="journal-content">
                <h2 id="final-name">Dear Mom,</h2>
                <p id="final-message"></p>
                <div class="journal-footer">
                    <p>Happy Mother's Day 2026</p>
                    <span class="sparkle">✨</span>
                </div>
            </div>
        </div>
        
        <div class="action-buttons">
            <button id="download-btn" class="secondary-btn">Download as JPEG</button>
            <button onclick="location.reload()" class="text-btn">Start Over</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
